<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pigment</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <svg width="28" height="22" viewBox="0 0 130 100" xmlns="http://www.w3.org/2000/svg">
        <!-- dark value -->
        <path fill="#a85d05" d="M28 8 C14 8 4 20 5 36 C6 46 2 52 4 62 C7 74 18 82 30 81 C38 80 43 74 46 66 C51 55 60 52 58 40 C56 26 44 8 28 8 Z"/>
        <!-- mid value -->
        <path fill="#d97706" d="M58 12 C44 10 32 22 34 38 C35 50 28 56 31 67 C34 78 46 86 58 84 C68 82 74 74 76 64 C80 52 90 48 88 35 C85 20 72 14 58 12 Z"/>
        <!-- light value -->
        <path fill="#f5a623" d="M90 18 C78 14 66 26 68 42 C70 54 63 60 66 70 C69 80 80 88 92 85 C102 83 108 74 110 63 C114 50 124 46 122 34 C119 20 104 22 90 18 Z"/>
      </svg>
      <h1>PIGMENT</h1>
    </div>
  </header>

  <main>
    <section class="input-section" id="inputSection">
      <div class="drop-zone" id="dropZone">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <p>Drop an image here</p>
        <span class="or">or</span>
        <button class="btn" id="uploadBtn">Choose File</button>
      </div>

      <div class="url-row">
        <input type="text" id="urlInput" placeholder="Paste an image URL (JPEG, PNG, WEBP, GIF)" />
        <button class="btn btn-primary" id="urlBtn">Load</button>
      </div>

      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
    </section>

    <canvas id="originalCanvas" hidden></canvas>

    <section class="results" id="results" hidden>

      <div class="canvas-area">
        <div class="canvas-wrap-header">
          <div class="slider-row">
            <span class="slider-label">Colors <span id="colorCount"></span></span>
            <span>4</span>
            <input type="range" id="colorSlider" min="4" max="256" value="64" step="4" list="colorTicks">
            <span>256</span>
            <input type="number" id="colorInput" min="4" max="256" value="64" step="4">
          </div>
          <datalist id="colorTicks">
            <option value="4"></option><option value="8"></option><option value="12"></option><option value="16"></option>
            <option value="20"></option><option value="24"></option><option value="28"></option><option value="32"></option>
            <option value="36"></option><option value="40"></option><option value="44"></option><option value="48"></option>
            <option value="52"></option><option value="56"></option><option value="60"></option><option value="64"></option>
            <option value="68"></option><option value="72"></option><option value="76"></option><option value="80"></option>
            <option value="84"></option><option value="88"></option><option value="92"></option><option value="96"></option>
            <option value="100"></option><option value="104"></option><option value="108"></option><option value="112"></option>
            <option value="116"></option><option value="120"></option><option value="124"></option><option value="128"></option>
            <option value="132"></option><option value="136"></option><option value="140"></option><option value="144"></option>
            <option value="148"></option><option value="152"></option><option value="156"></option><option value="160"></option>
            <option value="164"></option><option value="168"></option><option value="172"></option><option value="176"></option>
            <option value="180"></option><option value="184"></option><option value="188"></option><option value="192"></option>
            <option value="196"></option><option value="200"></option><option value="204"></option><option value="208"></option>
            <option value="212"></option><option value="216"></option><option value="220"></option><option value="224"></option>
            <option value="228"></option><option value="232"></option><option value="236"></option><option value="240"></option>
            <option value="244"></option><option value="248"></option><option value="252"></option><option value="256"></option>
          </datalist>
          <div class="canvas-header-btns">
            <button class="btn btn-toggle" id="outlineBtn">Paint by Numbers</button>
            <button class="btn btn-toggle active" id="labelsBtn">Labels</button>
          </div>
        </div>
        <div class="canvas-container">
          <canvas id="quantizedCanvas"></canvas>
          <canvas id="overlayCanvas"></canvas>
          <div id="labelOverlay" class="label-overlay"></div>
        </div>
        <div id="attribution" class="attribution" hidden>
          Ivan Mischo (1934–1992) &mdash; <em>Abstract Composition</em>, mixed media on paper, 23&thinsp;&times;&thinsp;31 in.
        </div>
      </div>

      <div class="palette-controls">
        <span class="palette-ctrl-label">Consolidate similar mixes</span>
        <div class="slider-row">
          <span>off</span>
          <input type="range" id="consolidateSlider" min="0" max="25" value="5" step="1">
          <span>max</span>
        </div>
        <div class="palette-expand-btns">
          <button class="btn btn-toggle" id="expandAllBtn">Expand All</button>
          <button class="btn btn-toggle" id="collapseAllBtn">Collapse All</button>
          <button class="btn btn-toggle btn-primary" id="exportBtn" style="margin-left:12px">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:5px"><path d="M12 3v13M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>Export PDF
          </button>
        </div>
      </div>

      <div class="palette-columns" id="swatches"></div>

      <div class="shopping-list" id="shoppingList"></div>

    </section>
  </main>

  <div id="colorTooltip" class="color-tooltip"></div>
  <div id="status" class="toast" hidden></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
